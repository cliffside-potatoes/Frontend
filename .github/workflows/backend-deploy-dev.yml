name: CI/CD Frontend NaengGu (dev)

on:
  push:
    branches:
      - main

############### CI #########################

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Docker Hub login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/naeng-gu-frontend:test .
          docker push ${{ secrets.DOCKER_USERNAME }}/naeng-gu-frontend:test

################### CD ########################

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/naeng-gu/infra/docker
            sudo docker compose pull frontend-test
            sudo docker compose up -d frontend-test
